<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>AI Studio — доступ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231677ff'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; color: rgba(0,0,0,.88);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; padding: 32px; border-radius: 8px; background: #fff;
    box-shadow: 0 6px 16px 0 rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05); }
  .logo { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: #1677ff; margin-bottom: 20px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; line-height: 28px; color: rgba(0,0,0,.88); }
  p { margin: 0 0 24px; font-size: 14px; line-height: 22px; color: rgba(0,0,0,.45); }
  input { width: 100%; height: 40px; padding: 7px 11px; border-radius: 8px; border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,.88);
    font: inherit; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:hover { border-color: #4096ff; }
  input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,.1); }
  button { margin-top: 16px; width: 100%; height: 40px; border: 0; border-radius: 8px; color: #fff; font: inherit; font-size: 16px; cursor: pointer;
    background: #1677ff; box-shadow: 0 2px 0 rgba(5,145,255,.1); transition: background .2s; }
  button:hover { background: #4096ff; }
  button:active { background: #0958d9; }
  .err { min-height: 22px; margin-top: 12px; font-size: 14px; color: #ff4d4f; text-align: center; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19 12 5l6 14M8.4 14h7.2"/></svg></div>
  <h1>Закрытый доступ</h1>
  <p>Сайт в разработке. Введите пароль, чтобы продолжить.</p>
  <input id="p" type="password" placeholder="Пароль" autofocus />
  <button type="submit">Войти</button>
  <div class="err" id="e"></div>
</form>
<script>
  // The server compares the cookie against sha256("it-hub:" + password); the password itself is never stored here.
  var e = document.getElementById('e');
  if (document.cookie.indexOf('hub_access=') !== -1) {
    e.textContent = 'Неверный пароль';
    document.cookie = 'hub_access=; Max-Age=0; Path=/';
  }
  document.getElementById('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var pass = document.getElementById('p').value;
    if (!pass) return;
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('it-hub:' + pass));
    var hex = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    var secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = 'hub_access=' + hex + '; Max-Age=2592000; Path=/; SameSite=Lax' + secure;
    location.reload();
  });
</script>
</body>
</html>
